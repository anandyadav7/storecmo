<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">The three layers of AI marketing</title><desc id="desc">Analysis informs decisions, which guide execution. Most AI tools cluster at execution.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:34px;font-weight:700}.k{font-size:25px;font-weight:700}.p{font-size:18px;fill:#4c554a}.s{font-size:14px;font-weight:700;fill:#0b5c40;letter-spacing:1.4px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="85" class="t h">AI marketing works in three layers</text><text x="70" y="120" class="p">The strongest value for a lean team begins before drafting.</text><path d="M370 345h60m340 0h60" stroke="#0f8a5f" stroke-width="7" stroke-linecap="round"/><g><rect x="70" y="215" width="300" height="260" rx="24" fill="#fff" stroke="#dde3d9" stroke-width="2"/><text x="110" y="275" class="t s">01 · READ</text><text x="110" y="330" class="t k">Analysis</text><text x="110" y="370" class="p">What changed?</text><text x="110" y="402" class="p">What is true?</text></g><g><rect x="430" y="215" width="340" height="260" rx="24" fill="#103a2a"/><text x="470" y="275" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#bcd3c4" letter-spacing="1.4">02 · PRIORITISE</text><text x="470" y="330" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#f0f6ee">Decision</text><text x="470" y="370" font-family="Arial,sans-serif" font-size="18" fill="#bcd3c4">What matters most?</text><text x="470" y="402" font-family="Arial,sans-serif" font-size="18" fill="#bcd3c4">What should happen next?</text></g><g><rect x="830" y="215" width="300" height="260" rx="24" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="870" y="275" class="t s">03 · MAKE</text><text x="870" y="330" class="t k">Execution</text><text x="870" y="370" class="p">Drafts, campaigns,</text><text x="870" y="402" class="p">and repeatable work.</text></g><text x="70" y="575" class="p">Keep a human close to decisions that spend money or reach customers.</text></svg>
