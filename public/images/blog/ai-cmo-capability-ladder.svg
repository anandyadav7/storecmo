<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AI CMO capability ladder</title><desc id="desc">A capability ladder from analysis and prioritisation through strategy and execution, with human judgment as the final boundary.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:32px;font-weight:700}.p{font-size:17px;fill:#4c554a}.k{font-size:21px;font-weight:700}.s{font-size:14px;font-weight:700;fill:#0b5c40;letter-spacing:1.3px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="84" class="t h">An AI CMO label can cover very different capabilities</text><text x="70" y="119" class="p">The higher the claim, the more context and human supervision it needs.</text><g><rect x="90" y="455" width="188" height="98" rx="20" fill="#e2efe6"/><text x="114" y="490" class="t s">01</text><text x="114" y="528" class="t k">Analysis</text></g><g><rect x="288" y="390" width="188" height="163" rx="20" fill="#fff"/><text x="312" y="425" class="t s">02</text><text x="312" y="463" class="t k">Prioritisation</text><text x="312" y="494" class="p">Rank the work</text></g><g><rect x="486" y="325" width="188" height="228" rx="20" fill="#fff3ec"/><text x="510" y="360" class="t s">03</text><text x="510" y="398" class="t k">Strategy</text><text x="510" y="429" class="p">Weigh trade-offs</text></g><g><rect x="684" y="260" width="188" height="293" rx="20" fill="#fff"/><text x="708" y="295" class="t s">04</text><text x="708" y="333" class="t k">Execution</text><text x="708" y="364" class="p">Draft and act</text><text x="708" y="395" class="p">with guardrails</text></g><g><rect x="882" y="195" width="228" height="358" rx="20" fill="#103a2a"/><text x="910" y="230" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#bcd3c4" letter-spacing="1.3">05 · HUMAN OWNERSHIP</text><text x="910" y="268" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#f0f6ee">Judgment</text><text x="910" y="300" font-family="Arial,sans-serif" font-size="17" fill="#bcd3c4">Brand, risk, ethics,</text><text x="910" y="330" font-family="Arial,sans-serif" font-size="17" fill="#bcd3c4">and creative direction</text></g><text x="90" y="610" class="p">The category is strongest at analysis; judgment remains the human boundary.</text></svg>
