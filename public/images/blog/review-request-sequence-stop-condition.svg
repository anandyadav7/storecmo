<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">A review request sequence that stops on a submitted review</title><desc id="desc">The order is fulfilled, a delivery check gates the wait, then the request email sends. A submitted review check ends the sequence immediately. Only non-responders continue to a first reminder and then a second, after which the flow ends regardless.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:31px;font-weight:700}.p{font-size:16px;fill:#4c554a}.n{font-size:17px;font-weight:700}.m{font-size:14px;fill:#4c554a}.s{font-size:12px;font-weight:700;letter-spacing:1.2px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="64" class="t h">The stop condition, not the send count</text><text x="70" y="96" class="p">A review arriving at any point ends the sequence. Nobody is asked twice.</text><rect x="70" y="150" width="220" height="128" rx="18" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="92" y="188" class="t n">Order fulfilled</text><text x="92" y="216" class="t m">The trigger, not the send.</text><rect x="325" y="150" width="220" height="128" rx="18" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="347" y="188" class="t n">Delivered?</text><text x="347" y="216" class="t m">Carrier status, with a</text><text x="347" y="236" class="t m">fallback delay if it</text><text x="347" y="256" class="t m">never confirms.</text><rect x="580" y="150" width="220" height="128" rx="18" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="602" y="188" class="t n">Wait</text><text x="602" y="216" class="t m">As long as the product</text><text x="602" y="236" class="t m">takes to form an</text><text x="602" y="256" class="t m">opinion about.</text><rect x="835" y="150" width="220" height="128" rx="18" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="857" y="188" class="t n">Request email</text><text x="857" y="216" class="t m">One product. One ask.</text><text x="857" y="236" class="t m">One link.</text><path d="M290 214h35" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><path d="M545 214h35" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><path d="M800 214h35" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><rect x="835" y="330" width="220" height="74" rx="18" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="857" y="362" class="t n">Review submitted?</text><text x="857" y="386" class="t m">Checked before every send.</text><path d="M945 278v52" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><path d="M1055 367h45" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><text x="1062" y="354" class="t s" fill="#0b5c40">YES</text><rect x="1000" y="392" width="130" height="52" rx="16" fill="#103a2a"/><text x="1022" y="424" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f0f6ee">Stop</text><path d="M1100 367v25" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><text x="782" y="362" class="t s" fill="#7a3c17">NO</text><path d="M835 367h-55" stroke="#ff8a5c" stroke-width="5" stroke-linecap="round"/><path d="M780 367V492h--20" stroke="#ff8a5c" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="580" y="462" width="220" height="60" rx="16" fill="#ffffff" stroke="#ffd9c4" stroke-width="2"/><text x="602" y="499" class="t n">Reminder 1</text><rect x="325" y="462" width="220" height="60" rx="16" fill="#ffffff" stroke="#ffd9c4" stroke-width="2"/><text x="347" y="499" class="t n">Reminder 2</text><path d="M580 492h-35" stroke="#ff8a5c" stroke-width="5" stroke-linecap="round"/><text x="606" y="516" class="t m" font-size="13">Two weeks apart. Re-check first.</text><path d="M325 492h-35" stroke="#ff8a5c" stroke-width="5" stroke-linecap="round"/><rect x="70" y="462" width="220" height="60" rx="16" fill="#103a2a"/><text x="92" y="499" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f0f6ee">End regardless</text><text x="70" y="625" class="t p">Cap it at three emails. A fourth is asking a question the customer has already declined to answer.</text></svg>