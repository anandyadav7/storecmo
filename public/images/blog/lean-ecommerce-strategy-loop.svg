<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">The lean ecommerce marketing strategy loop</title><desc id="desc">A five-part loop for growth opportunity, customer positioning, channel focus, store rhythm, and weekly measurement.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:32px;font-weight:700}.k{font-size:20px;font-weight:700}.s{font-size:14px;font-weight:700;fill:#0b5c40;letter-spacing:1.2px}.p{font-size:17px;fill:#4c554a}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="84" class="t h">A strategy is a loop of five connected decisions</text><text x="70" y="119" class="p">Each decision narrows the next, then weekly measurement sends you back to the start.</text><path d="M300 294C393 186 560 170 680 231S883 401 823 497 574 573 416 510 202 408 300 294Z" fill="none" stroke="#0f8a5f" stroke-width="5" stroke-dasharray="8 14"/><g><rect x="458" y="230" width="284" height="110" rx="22" fill="#103a2a"/><text x="490" y="270" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#bcd3c4" letter-spacing="1.2">01 · OPPORTUNITY</text><text x="490" y="308" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#f0f6ee">Find the growth lever</text></g><g><rect x="755" y="298" width="280" height="110" rx="22" fill="#fff"/><text x="786" y="338" class="t s">02 · POSITION</text><text x="786" y="374" class="t k">Define buyer + reason</text></g><g><rect x="633" y="474" width="280" height="110" rx="22" fill="#fff3ec"/><text x="664" y="514" class="t s">03 · FOCUS</text><text x="664" y="550" class="t k">Choose channels</text></g><g><rect x="275" y="474" width="280" height="110" rx="22" fill="#fff"/><text x="306" y="514" class="t s">04 · RHYTHM</text><text x="306" y="550" class="t k">Build the calendar</text></g><g><rect x="156" y="298" width="280" height="110" rx="22" fill="#e2efe6"/><text x="187" y="338" class="t s">05 · LEARN</text><text x="187" y="374" class="t k">Measure weekly</text></g></svg>
