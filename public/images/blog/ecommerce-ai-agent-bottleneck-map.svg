<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Match an ecommerce AI agent to the bottleneck</title><desc id="desc">A decision map connecting five ecommerce bottlenecks to the corresponding AI agent category.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:32px;font-weight:700}.p{font-size:17px;fill:#4c554a}.k{font-size:20px;font-weight:700}.l{font-size:14px;font-weight:700;fill:#0b5c40;letter-spacing:1px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="85" class="t h">Start with the bottleneck, not the brand name</text><text x="70" y="120" class="p">Choose one agent for the constraint costing your team the most this month.</text><rect x="70" y="180" width="270" height="390" rx="24" fill="#103a2a"/><text x="112" y="230" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#bcd3c4" letter-spacing="1.4">THE BOTTLENECK</text><g font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#f0f6ee"><text x="112" y="292">Support volume</text><text x="112" y="354">On-site conversion</text><text x="112" y="416">Retention messaging</text><text x="112" y="478">Measurement</text><text x="112" y="540">Store admin</text></g><g><rect x="455" y="252" width="640" height="58" rx="16" fill="#fff"/><text x="485" y="277" class="t l">SUPPORT</text><text x="485" y="300" class="t k">Gorgias AI Agent</text><rect x="455" y="318" width="640" height="58" rx="16" fill="#fff"/><text x="485" y="343" class="t l">CONVERSION</text><text x="485" y="366" class="t k">Rep AI</text><rect x="455" y="384" width="640" height="58" rx="16" fill="#fff"/><text x="485" y="409" class="t l">RETENTION</text><text x="485" y="432" class="t k">Klaviyo AI</text><rect x="455" y="450" width="640" height="58" rx="16" fill="#fff3ec"/><text x="485" y="475" class="t l">MEASUREMENT</text><text x="485" y="498" class="t k">Triple Whale Moby 2</text><rect x="455" y="516" width="640" height="58" rx="16" fill="#e2efe6"/><text x="485" y="541" class="t l">ADMIN</text><text x="485" y="564" class="t k">Shopify Sidekick</text></g></svg>
