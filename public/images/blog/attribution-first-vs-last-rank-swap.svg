<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Channel rank under first click against last click</title><desc id="desc">The same date range ranked twice. Organic search and direct hold their positions under both models. Instagram falls from second on first click to fifth on last click, which suggests it introduces customers. Email rises from fourth to second, which suggests it collects demand created elsewhere. Only the channels that move need a decision.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:32px;font-weight:700}.p{font-size:16px;fill:#4c554a}.s{font-size:12px;font-weight:700;letter-spacing:1.2px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="90" y="68" class="t h">Read it twice. Watch what moves.</text><text x="90" y="100" class="p">Same date range, same orders, two credit rules. Only the movers need a decision.</text><text x="90" y="160" class="t s" fill="#0b5c40">FIRST CLICK</text><text x="740" y="160" class="t s" fill="#0b5c40">LAST CLICK</text><path d="M460 211C555 211 645 211 740 211" fill="none" stroke="#cdd6cc" stroke-width="3"/><path d="M460 276C555 276 645 471 740 471" fill="none" stroke="#ff8a5c" stroke-width="4"/><path d="M460 341C555 341 645 341 740 341" fill="none" stroke="#cdd6cc" stroke-width="3"/><path d="M460 406C555 406 645 276 740 276" fill="none" stroke="#0f8a5f" stroke-width="4"/><path d="M460 471C555 471 645 406 740 406" fill="none" stroke="#cdd6cc" stroke-width="3"/><rect x="90" y="185" width="370" height="52" rx="14" fill="#f3f5f0" stroke="#dde3d9" stroke-width="2"/><text x="114" y="218" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8a938a">1</text><text x="148" y="218" font-family="Arial,sans-serif" font-size="18" fill="#4c554a">Organic search</text><rect x="90" y="250" width="370" height="52" rx="14" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="114" y="283" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#7a3c17">2</text><text x="148" y="283" font-family="Arial,sans-serif" font-size="18" fill="#1c211b">Instagram</text><rect x="90" y="315" width="370" height="52" rx="14" fill="#f3f5f0" stroke="#dde3d9" stroke-width="2"/><text x="114" y="348" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8a938a">3</text><text x="148" y="348" font-family="Arial,sans-serif" font-size="18" fill="#4c554a">Direct</text><rect x="90" y="380" width="370" height="52" rx="14" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="114" y="413" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0b5c40">4</text><text x="148" y="413" font-family="Arial,sans-serif" font-size="18" fill="#1c211b">Email</text><rect x="90" y="445" width="370" height="52" rx="14" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="114" y="478" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8a938a">5</text><text x="148" y="478" font-family="Arial,sans-serif" font-size="18" fill="#1c211b">Google Ads</text><rect x="740" y="185" width="370" height="52" rx="14" fill="#f3f5f0" stroke="#dde3d9" stroke-width="2"/><text x="764" y="218" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8a938a">1</text><text x="798" y="218" font-family="Arial,sans-serif" font-size="18" fill="#4c554a">Organic search</text><rect x="740" y="250" width="370" height="52" rx="14" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="764" y="283" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0b5c40">2</text><text x="798" y="283" font-family="Arial,sans-serif" font-size="18" fill="#1c211b">Email</text><text x="1086" y="283" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#0b5c40" text-anchor="end">collects</text><rect x="740" y="315" width="370" height="52" rx="14" fill="#f3f5f0" stroke="#dde3d9" stroke-width="2"/><text x="764" y="348" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8a938a">3</text><text x="798" y="348" font-family="Arial,sans-serif" font-size="18" fill="#4c554a">Direct</text><rect x="740" y="380" width="370" height="52" rx="14" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="764" y="413" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8a938a">4</text><text x="798" y="413" font-family="Arial,sans-serif" font-size="18" fill="#1c211b">Google Ads</text><rect x="740" y="445" width="370" height="52" rx="14" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="764" y="478" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#7a3c17">5</text><text x="798" y="478" font-family="Arial,sans-serif" font-size="18" fill="#1c211b">Instagram</text><text x="1086" y="478" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7a3c17" text-anchor="end">introduces</text><rect x="90" y="540" width="1020" height="86" rx="24" fill="#103a2a"/><text x="122" y="578" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#8fae9c" letter-spacing="1.2">TWO HELD THEIR PLACE. STOP THINKING ABOUT THOSE.</text><text x="122" y="608" font-family="Arial,sans-serif" font-size="17" fill="#f0f6ee">Neither model proves the spend caused the order. The swap tells you what to test next.</text></svg>