<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">The order a product description should answer questions in</title><desc id="desc">Answer the objection first, then prove it with a specific detail, then add fit and use context, then close the risk. A generic opening line becomes a specific one.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:34px;font-weight:700}.k{font-size:22px;font-weight:700}.p{font-size:16px;fill:#4c554a}.s{font-size:13px;font-weight:700;fill:#0b5c40;letter-spacing:1.3px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="78" class="t h">Answer the objection before anything else</text><text x="70" y="112" class="p">The buyer already wants it. They are looking for the reason not to buy.</text><path d="M310 320h33m240 0h33m240 0h33" stroke="#0f8a5f" stroke-width="6" stroke-linecap="round"/><g><rect x="70" y="200" width="240" height="240" rx="24" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="98" y="242" class="t s">01</text><text x="98" y="284" class="t k">Objection</text><text x="98" y="322" class="p">The specific thing</text><text x="98" y="346" class="p">stopping them.</text><text x="98" y="392" class="p">Not a slogan.</text></g><g><rect x="343" y="200" width="240" height="240" rx="24" fill="#fff" stroke="#dde3d9" stroke-width="2"/><text x="371" y="242" class="t s">02</text><text x="371" y="284" class="t k">Proof</text><text x="371" y="322" class="p">A measurement,</text><text x="371" y="346" class="p">a material, a spec.</text><text x="371" y="392" class="p">Something checkable.</text></g><g><rect x="616" y="200" width="240" height="240" rx="24" fill="#fff" stroke="#dde3d9" stroke-width="2"/><text x="644" y="242" class="t s">03</text><text x="644" y="284" class="t k">Context</text><text x="644" y="322" class="p">Who it suits, when</text><text x="644" y="346" class="p">it works, what it</text><text x="644" y="370" class="p">does not do.</text></g><g><rect x="889" y="200" width="240" height="240" rx="24" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="917" y="242" class="t s" fill="#7a3c17">04</text><text x="917" y="284" class="t k">Risk</text><text x="917" y="322" class="p">Returns, warranty,</text><text x="917" y="346" class="p">restock.</text><text x="917" y="392" class="p">The last hesitation.</text></g><rect x="70" y="482" width="1060" height="130" rx="24" fill="#103a2a"/><text x="102" y="522" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#8fae9c" letter-spacing="1.3">BEFORE</text><text x="102" y="550" font-family="Arial,sans-serif" font-size="17" fill="#8fae9c">Crafted from premium full-grain leather for the modern professional.</text><text x="102" y="580" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#bcd3c4" letter-spacing="1.3">AFTER</text><text x="200" y="580" font-family="Arial,sans-serif" font-size="17" fill="#f0f6ee">Fits a 16-inch laptop with the charger, in a padded sleeve measuring 38 x 26 cm.</text></svg>
