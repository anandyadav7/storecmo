<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">What an AI CMO announcement transfers, and what the role actually carries</title><desc id="desc">An announcement transfers the title, the coverage and a face for the brand. The role carries named delegated decisions, budget authority, a named accountable human and reversal rights that get used.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:34px;font-weight:700}.p{font-size:17px;fill:#4c554a}.i{font-size:18px;fill:#1c211b}.il{font-size:18px;fill:#f0f6ee}.s{font-size:13px;font-weight:700;letter-spacing:1.3px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="78" class="t h">The title moves. The authority does not.</text><text x="70" y="112" class="p">Every AI executive appointment so far has kept the significant decisions human.</text><g><rect x="70" y="150" width="500" height="400" rx="24" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="106" y="196" class="t s" fill="#7a3c17">WHAT THE ANNOUNCEMENT GIVES</text><circle cx="116" cy="264" r="6" fill="#ff8a5c"/><text x="140" y="270" class="t i">The title itself</text><circle cx="116" cy="324" r="6" fill="#ff8a5c"/><text x="140" y="330" class="t i">Press coverage</text><circle cx="116" cy="384" r="6" fill="#ff8a5c"/><text x="140" y="390" class="t i">A face for the brand</text><text x="106" y="474" class="p">All three are real. None of</text><text x="106" y="500" class="p">them is a decision.</text></g><g><rect x="630" y="150" width="500" height="400" rx="24" fill="#103a2a"/><text x="666" y="196" class="s" font-family="Arial,sans-serif" fill="#bcd3c4">WHAT THE ROLE ACTUALLY CARRIES</text><circle cx="676" cy="256" r="6" fill="#0f8a5f"/><text x="700" y="262" class="il">Named delegated decisions</text><circle cx="676" cy="316" r="6" fill="#0f8a5f"/><text x="700" y="322" class="il">Budget authority, with a ceiling</text><circle cx="676" cy="376" r="6" fill="#0f8a5f"/><text x="700" y="382" class="il">A named accountable human</text><circle cx="676" cy="436" r="6" fill="#0f8a5f"/><text x="700" y="442" class="il">Reversal rights that get used</text><text x="666" y="504" font-family="Arial,sans-serif" font-size="17" fill="#bcd3c4">Ask for all four before the superlative.</text></g><rect x="70" y="582" width="1060" height="62" rx="24" fill="#fff" stroke="#dde3d9" stroke-width="2"/><text x="106" y="620" class="t p">Dictador appointed a robot chief executive in 2022, then confirmed that significant decisions stay with human executives.</text></svg>
