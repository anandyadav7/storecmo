<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">A four-week setup for AI in ecommerce marketing</title><desc id="desc">Week one builds the context document, week two hands over one job, week three adds a review step, and week four decides whether to keep it.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:34px;font-weight:700}.k{font-size:22px;font-weight:700}.p{font-size:16px;fill:#4c554a}.s{font-size:13px;font-weight:700;fill:#0b5c40;letter-spacing:1.3px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="80" class="t h">Four weeks, then an honest decision</text><text x="70" y="114" class="p">The context document is the only step that pays back whichever tools you end up using.</text><path d="M310 355h33m240 0h33m240 0h33" stroke="#0f8a5f" stroke-width="6" stroke-linecap="round"/><g><rect x="70" y="230" width="240" height="250" rx="24" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="98" y="272" class="t s">WEEK 01</text><text x="98" y="312" class="t k">Context</text><text x="98" y="348" class="p">One page on what you</text><text x="98" y="372" class="p">sell, to whom, and why.</text><text x="98" y="428" class="p">Everything else</text><text x="98" y="452" class="p">depends on this.</text></g><g><rect x="343" y="230" width="240" height="250" rx="24" fill="#fff" stroke="#dde3d9" stroke-width="2"/><text x="371" y="272" class="t s">WEEK 02</text><text x="371" y="312" class="t k">One job</text><text x="371" y="348" class="p">Hours to do, and an</text><text x="371" y="372" class="p">output you can check.</text><text x="371" y="428" class="p">Not ads. Not</text><text x="371" y="452" class="p">&quot;my marketing&quot;.</text></g><g><rect x="616" y="230" width="240" height="250" rx="24" fill="#fff" stroke="#dde3d9" stroke-width="2"/><text x="644" y="272" class="t s">WEEK 03</text><text x="644" y="312" class="t k">Review</text><text x="644" y="348" class="p">A named checkpoint</text><text x="644" y="372" class="p">and a written list.</text><text x="644" y="428" class="p">Catches plausible</text><text x="644" y="452" class="p">output, not just bad.</text></g><g><rect x="889" y="230" width="240" height="250" rx="24" fill="#103a2a"/><text x="917" y="272" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#bcd3c4" letter-spacing="1.3">WEEK 04</text><text x="917" y="312" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f0f6ee">Keep or stop</text><text x="917" y="348" font-family="Arial,sans-serif" font-size="16" fill="#bcd3c4">Did it return hours,</text><text x="917" y="372" font-family="Arial,sans-serif" font-size="16" fill="#bcd3c4">once review is counted?</text><text x="917" y="428" font-family="Arial,sans-serif" font-size="16" fill="#bcd3c4">Stopping is the right</text><text x="917" y="452" font-family="Arial,sans-serif" font-size="16" fill="#bcd3c4">answer about half the time.</text></g><rect x="70" y="530" width="1060" height="72" rx="24" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="102" y="562" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#7a3c17" letter-spacing="1.3">THE RULE THAT DOES NOT MOVE</text><text x="102" y="588" class="p">Nothing that names a price or a date, spends money, or reaches a customer goes out unreviewed.</text></svg>
