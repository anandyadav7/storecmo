<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">The order to read Shopify Analytics in</title><desc id="desc">Five rungs read from the top down: sessions, conversion rate, average order value, customer cohorts, then profit reports. Stop at the first rung that moved the wrong way and make that the month's only fix. Everything below it waits.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:34px;font-weight:700}.k{font-size:21px;font-weight:700}.p{font-size:16px;fill:#4c554a}.s{font-size:13px;font-weight:700;letter-spacing:1.3px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="78" class="t h">Read down. Stop at the first break.</text><text x="70" y="112" class="p">Each number explains the one below it, so the order is the method.</text><rect x="70" y="156" width="760" height="78" rx="20" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="100" y="204" class="t s" fill="#0b5c40">01</text><text x="148" y="204" class="t k">Sessions</text><text x="470" y="204" class="p">Did people show up?</text><path d="M450 238v8" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><rect x="70" y="250" width="760" height="78" rx="20" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="100" y="298" class="t s" fill="#0b5c40">02</text><text x="148" y="298" class="t k">Conversion rate</text><text x="470" y="298" class="p">Where did they stop?</text><path d="M450 332v8" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><rect x="70" y="344" width="760" height="78" rx="20" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="100" y="392" class="t s" fill="#0b5c40">03</text><text x="148" y="392" class="t k">Average order value</text><text x="470" y="392" class="p">Is each order worth what it was?</text><path d="M450 426v8" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><rect x="70" y="438" width="760" height="78" rx="20" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="100" y="486" class="t s" fill="#0b5c40">04</text><text x="148" y="486" class="t k">Customer cohorts</text><text x="470" y="486" class="p">Do buyers come back?</text><path d="M450 520v8" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><rect x="70" y="532" width="760" height="78" rx="20" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="100" y="580" class="t s" fill="#7a3c17">05</text><text x="148" y="580" class="t k">Profit reports</text><text x="470" y="580" class="p">Does any of it survive costs?</text><rect x="864" y="156" width="266" height="454" rx="24" fill="#103a2a"/><text x="896" y="206" class="s" font-family="Arial,sans-serif" fill="#8fae9c">THE WHOLE RULE</text><text x="896" y="258" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#f0f6ee">Stop at the first</text><text x="896" y="288" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#f0f6ee">number that moved</text><text x="896" y="318" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#f0f6ee">the wrong way.</text><text x="896" y="378" font-family="Arial,sans-serif" font-size="16" fill="#bcd3c4">Everything below it</text><text x="896" y="408" font-family="Arial,sans-serif" font-size="16" fill="#bcd3c4">waits until next month.</text><text x="896" y="468" font-family="Arial,sans-serif" font-size="16" fill="#bcd3c4">One broken number.</text><text x="896" y="498" font-family="Arial,sans-serif" font-size="16" fill="#bcd3c4">One change.</text><text x="896" y="528" font-family="Arial,sans-serif" font-size="16" fill="#bcd3c4">One check-back date.</text><text x="896" y="576" font-family="Arial,sans-serif" font-size="16" fill="#8fae9c">That is the month.</text></svg>