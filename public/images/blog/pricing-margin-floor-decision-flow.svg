<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">The pricing decision rule, in four steps</title><desc id="desc">Set the contribution margin floor, subtract every variable cost at the price actually charged, convert what remains into a break-even ROAS, then act on the gap by raising the price, cutting a cost, or stopping paid acquisition for that product.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:32px;font-weight:700}.p{font-size:16px;fill:#4c554a}.k{font-size:21px;font-weight:700}.b{font-size:15px;fill:#4c554a}.s{font-size:12px;font-weight:700;letter-spacing:1.2px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="68" class="t h">Price backwards from the floor</text><text x="70" y="100" class="p">Three calculations, then one decision. The fourth step is the one teams skip.</text><path d="M130 275v20" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><path d="M130 407v20" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><path d="M500 483h70" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M570 483V252h40" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="70" y="163" width="430" height="112" rx="20" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="98" y="195" class="t s" fill="#0b5c40">01</text><text x="98" y="225" class="t k">Margin floor</text><text x="98" y="251" class="t b">Fixed costs divided by contribution</text><text x="98" y="272" class="t b">margin per unit gives the units</text><text x="98" y="293" class="t b">needed before anything is profit.</text><rect x="70" y="295" width="430" height="112" rx="20" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="98" y="327" class="t s" fill="#0b5c40">02</text><text x="98" y="357" class="t k">Variable costs</text><text x="98" y="383" class="t b">COGS, shipping, pick and pack,</text><text x="98" y="404" class="t b">payment and currency fees, and</text><text x="98" y="425" class="t b">the discount you actually run.</text><rect x="70" y="427" width="430" height="112" rx="20" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="98" y="459" class="t s" fill="#0b5c40">03</text><text x="98" y="489" class="t k">Break-even ROAS</text><text x="98" y="515" class="t b">1 divided by your contribution</text><text x="98" y="536" class="t b">margin ratio. Not the margin</text><text x="98" y="557" class="t b">shown on the product page.</text><rect x="640" y="163" width="490" height="112" rx="20" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="668" y="195" class="t s" fill="#7a3c17">04</text><text x="668" y="225" class="t k">Act on the gap</text><text x="668" y="253" class="t b">Is the required ROAS above what your account returns?</text><path d="M700 283v14" stroke="#ff8a5c" stroke-width="4" stroke-linecap="round"/><rect x="640" y="305" width="490" height="56" rx="16" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><circle cx="674" cy="333" r="6" fill="#ff8a5c"/><text x="698" y="340" font-family="Arial,sans-serif" font-size="18" fill="#1c211b">Raise the price</text><path d="M700 353v14" stroke="#ff8a5c" stroke-width="4" stroke-linecap="round"/><rect x="640" y="375" width="490" height="56" rx="16" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><circle cx="674" cy="403" r="6" fill="#ff8a5c"/><text x="698" y="410" font-family="Arial,sans-serif" font-size="18" fill="#1c211b">Cut a cost</text><path d="M700 423v14" stroke="#ff8a5c" stroke-width="4" stroke-linecap="round"/><rect x="640" y="445" width="490" height="56" rx="16" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><circle cx="674" cy="473" r="6" fill="#ff8a5c"/><text x="698" y="480" font-family="Arial,sans-serif" font-size="18" fill="#1c211b">Stop advertising that SKU</text><rect x="70" y="545" width="1060" height="80" rx="24" fill="#103a2a"/><text x="102" y="580" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#8fae9c" letter-spacing="1.2">THE RULE PROTECTS PROFIT PER ORDER</text><text x="102" y="608" font-family="Arial,sans-serif" font-size="17" fill="#f0f6ee">It cannot create orders. A correctly priced product still fails if too few people want it.</text></svg>