<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Two contribution-per-order subtractions, side by side</title><desc id="desc">On a forty dollar item, the Amazon column deducts product cost, a fifteen percent referral fee of six dollars, fulfilment and the plan fee per unit, leaving seventeen dollars sixty. The own-site column deducts product cost, card processing, shipping and fourteen dollars to acquire the order, leaving seven dollars fifty-four. The deciding comparison is the referral fee against the cost per acquired order.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:30px;font-weight:700}.p{font-size:16px;fill:#4c554a}.s{font-size:12px;font-weight:700;letter-spacing:1.2px}.li{font-size:17px;fill:#4c554a}.lv{font-size:17px;font-weight:700;fill:#1c211b}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="62" class="t h">Write the subtraction down</text><text x="70" y="94" class="p">Illustrative numbers on one $40 item. Use your own, for one product, before moving budget.</text><rect x="70" y="140" width="510" height="392" rx="20" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="100" y="178" class="t s" fill="#0b5c40">AMAZON MARKETPLACE</text><text x="100" y="224" class="t li" >Selling price</text><text x="550" y="224" class="t lv" text-anchor="end" >$40.00</text><text x="100" y="270" class="t li" >Product cost</text><text x="550" y="270" class="t lv" text-anchor="end" >-$12.00</text><rect x="86" y="292" width="478" height="34" rx="9" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="100" y="316" class="t li" font-weight="700" fill="#7a3c17">Referral fee, 15%</text><text x="550" y="316" class="t lv" text-anchor="end" fill="#7a3c17">-$6.00</text><text x="100" y="362" class="t li" >Fulfilment</text><text x="550" y="362" class="t lv" text-anchor="end" >-$4.00</text><text x="100" y="408" class="t li" >Plan fee, per unit</text><text x="550" y="408" class="t lv" text-anchor="end" >-$0.40</text><path d="M100 438h450" stroke="#bcd3c4" stroke-width="2"/><text x="100" y="478" class="t s" fill="#0b5c40">LEFT PER ORDER</text><text x="550" y="484" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1c211b" text-anchor="end">$17.60</text><rect x="620" y="140" width="510" height="392" rx="20" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="650" y="178" class="t s" fill="#0b5c40">YOUR OWN SITE</text><text x="650" y="224" class="t li" >Selling price</text><text x="1100" y="224" class="t lv" text-anchor="end" >$40.00</text><text x="650" y="270" class="t li" >Product cost</text><text x="1100" y="270" class="t lv" text-anchor="end" >-$12.00</text><text x="650" y="316" class="t li" >Card, 2.9% + 30c</text><text x="1100" y="316" class="t lv" text-anchor="end" >-$1.46</text><text x="650" y="362" class="t li" >Shipping</text><text x="1100" y="362" class="t lv" text-anchor="end" >-$5.00</text><rect x="636" y="384" width="478" height="34" rx="9" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="650" y="408" class="t li" font-weight="700" fill="#7a3c17">Cost per acquired order</text><text x="1100" y="408" class="t lv" text-anchor="end" fill="#7a3c17">-$14.00</text><path d="M650 438h450" stroke="#dde3d9" stroke-width="2"/><text x="650" y="478" class="t s" fill="#0b5c40">LEFT PER ORDER</text><text x="1100" y="484" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1c211b" text-anchor="end">$7.54</text><rect x="70" y="562" width="1060" height="78" rx="22" fill="#103a2a"/><text x="102" y="596" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#8fae9c" letter-spacing="1.2">THE TWO HIGHLIGHTED LINES DECIDE IT</text><text x="102" y="624" font-family="Arial,sans-serif" font-size="17" fill="#f0f6ee">A $6.00 referral fee against $14.00 to acquire the order yourself. Reverse those and your store wins.</text></svg>