<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Human oversight loop for an AI CMO</title><desc id="desc">An AI recommendation with visible reasoning is reviewed by a human before action and outcome review.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:32px;font-weight:700}.p{font-size:17px;fill:#4c554a}.k{font-size:21px;font-weight:700}.s{font-size:14px;font-weight:700;fill:#0b5c40;letter-spacing:1.3px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="84" class="t h">Visible reasoning keeps the human in control</text><text x="70" y="119" class="p">The recommendation is an input to judgment, not a substitute for it.</text><g><rect x="82" y="250" width="245" height="194" rx="24" fill="#fff"/><text x="115" y="294" class="t s">01 · AI</text><text x="115" y="335" class="t k">Recommendation</text><text x="115" y="369" class="p">Ranked options</text><text x="115" y="399" class="p">+ visible reasoning</text></g><g><rect x="388" y="250" width="245" height="194" rx="24" fill="#103a2a"/><text x="421" y="294" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#bcd3c4" letter-spacing="1.3">02 · HUMAN</text><text x="421" y="335" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#f0f6ee">Inspect + decide</text><text x="421" y="369" font-family="Arial,sans-serif" font-size="17" fill="#bcd3c4">Approve, change,</text><text x="421" y="399" font-family="Arial,sans-serif" font-size="17" fill="#bcd3c4">or override</text></g><g><rect x="694" y="250" width="245" height="194" rx="24" fill="#fff3ec"/><text x="727" y="294" class="t s">03 · STORE</text><text x="727" y="335" class="t k">Act with guardrails</text><text x="727" y="369" class="p">Spend and customer</text><text x="727" y="399" class="p">actions stay reviewable</text></g><g><rect x="1000" y="250" width="145" height="194" rx="24" fill="#e2efe6"/><text x="1023" y="294" class="t s">04</text><text x="1023" y="335" class="t k">Review</text><text x="1023" y="369" class="p">Learn from</text><text x="1023" y="399" class="p">outcomes</text></g><path d="M329 347h52m254 0h52m254 0h51" stroke="#0f8a5f" stroke-width="6" stroke-linecap="round"/><path d="M1072 458c-43 83-231 102-404 102S276 539 218 458" fill="none" stroke="#0f8a5f" stroke-width="6" stroke-linecap="round"/></svg>
