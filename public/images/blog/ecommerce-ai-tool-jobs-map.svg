<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AI tools for ecommerce marketing, mapped by job</title><desc id="desc">Six marketing jobs each have their own AI tools, while the decision layer above them, choosing which job matters next, has none.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:34px;font-weight:700}.k{font-size:23px;font-weight:700}.p{font-size:16px;fill:#4c554a}.s{font-size:13px;font-weight:700;fill:#0b5c40;letter-spacing:1.3px}.sp{font-size:13px;font-weight:700;fill:#7a3c17;letter-spacing:1.3px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="78" class="t h">Six jobs, six different answers</text><text x="70" y="112" class="p">Every production job has a tool. The decision above them does not.</text><rect x="70" y="140" width="1060" height="78" rx="24" fill="#103a2a"/><text x="102" y="176" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#bcd3c4" letter-spacing="1.3">THE DECISION LAYER</text><text x="102" y="203" font-family="Arial,sans-serif" font-size="18" fill="#f0f6ee">Which of these six jobs deserves the next four weeks? No tool below answers this.</text><g><rect x="70" y="252" width="340" height="152" rx="24" fill="#fff" stroke="#dde3d9" stroke-width="2"/><text x="102" y="288" class="t s">START HERE</text><text x="102" y="326" class="t k">Research and SEO</text><text x="102" y="358" class="p">Audits pages, ranks gaps.</text><text x="102" y="382" class="p">Surfer</text></g><g><rect x="430" y="252" width="340" height="152" rx="24" fill="#fff" stroke="#dde3d9" stroke-width="2"/><text x="462" y="288" class="t s">START HERE</text><text x="462" y="326" class="t k">Content</text><text x="462" y="358" class="p">Drafts to a brief you write.</text><text x="462" y="382" class="p">Jasper, a general assistant</text></g><g><rect x="790" y="252" width="340" height="152" rx="24" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="822" y="288" class="t s">CLEAREST PAYBACK</text><text x="822" y="326" class="t k">Product imagery</text><text x="822" y="358" class="p">Cutouts, staging, batches.</text><text x="822" y="382" class="p">Photoroom, Flair.ai</text></g><g><rect x="70" y="428" width="340" height="152" rx="24" fill="#fff" stroke="#dde3d9" stroke-width="2"/><text x="102" y="464" class="t s">KEEP APPROVAL ON</text><text x="102" y="502" class="t k">Email and SMS</text><text x="102" y="534" class="p">Copy, segments, send times.</text><text x="102" y="558" class="p">Omnisend, Klaviyo</text></g><g><rect x="430" y="428" width="340" height="152" rx="24" fill="#fff" stroke="#dde3d9" stroke-width="2"/><text x="462" y="464" class="t s">ALREADY RUNNING</text><text x="462" y="502" class="t k">Ads</text><text x="462" y="534" class="p">Bidding, placement, creative.</text><text x="462" y="558" class="p">The ad platforms themselves</text></g><g><rect x="790" y="428" width="340" height="152" rx="24" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="822" y="464" class="t sp">NOT YET</text><text x="822" y="502" class="t k">Measurement</text><text x="822" y="534" class="p">Attribution, forecasting.</text><text x="822" y="558" class="p">Northbeam, Triple Whale</text></g><text x="70" y="628" class="p">Buy one tool for the job costing you the most time. Give it a month before adding a second.</text></svg>
