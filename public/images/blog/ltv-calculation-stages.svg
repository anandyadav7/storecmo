<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Three stages of lifetime value calculation, gated by order history</title><desc id="desc">Under twelve months of orders you can only calculate a fixed window. Once one repeat cycle has passed you can group customers into cohorts. Only after twenty-four months per cohort will Shopify produce a projection. Every stage is measured in contribution margin, and all three feed one decision.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:34px;font-weight:700}.k{font-size:24px;font-weight:700}.p{font-size:16px;fill:#4c554a}.s{font-size:13px;font-weight:700;fill:#0b5c40;letter-spacing:1.3px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="78" class="t h">Calculate at the level your data supports</text><text x="70" y="112" class="p">Every stage is measured in contribution margin, never revenue.</text><path d="M401 335h33m331 0h33" stroke="#0f8a5f" stroke-width="6" stroke-linecap="round"/><g><rect x="70" y="210" width="331" height="250" rx="24" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="100" y="252" class="t s">STAGE 01 &#183; UNDER 12 MONTHS</text><text x="100" y="296" class="t k">Fixed window</text><text x="100" y="336" class="p">Contribution margin per customer</text><text x="100" y="360" class="p">over a set number of days from</text><text x="100" y="384" class="p">their first order.</text><text x="100" y="428" class="p">Count only windows that have</text><text x="100" y="452" class="p">fully closed.</text></g><g><rect x="434" y="210" width="331" height="250" rx="24" fill="#fff" stroke="#dde3d9" stroke-width="2"/><text x="464" y="252" class="t s">STAGE 02 &#183; ONE REPEAT CYCLE</text><text x="464" y="296" class="t k">Cohorts</text><text x="464" y="336" class="p">Group customers by the date of</text><text x="464" y="360" class="p">their first order and read across.</text><text x="464" y="428" class="p">Shopify builds the grid for you.</text><text x="464" y="452" class="p">Match intervals to how often</text><text x="464" y="476" class="p">people actually buy.</text></g><g><rect x="798" y="210" width="332" height="250" rx="24" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="828" y="252" class="t s" fill="#7a3c17">STAGE 03 &#183; 24 MONTHS PER COHORT</text><text x="828" y="296" class="t k">Projection</text><text x="828" y="336" class="p">Predicted future spend per</text><text x="828" y="360" class="p">cohort, from your store only.</text><text x="828" y="428" class="p">The toggle stays hidden until</text><text x="828" y="452" class="p">the history is there.</text></g><rect x="70" y="520" width="1060" height="110" rx="24" fill="#103a2a"/><text x="102" y="562" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#8fae9c" letter-spacing="1.3">ALL THREE FEED ONE DECISION</text><text x="102" y="596" font-family="Arial,sans-serif" font-size="18" fill="#f0f6ee">This month's ceiling on acquisition cost per new customer. Nothing else needs the number.</text></svg>
