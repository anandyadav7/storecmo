<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Seven checks for a landing page example, in deciding order</title><desc id="desc">A funnel from the offer at the widest point down to measurability at the narrowest. The top three, the offer, the above-the-fold decision logic and the message match, are shaded because they settle most outcomes. The four below them matter less and cost more to get right.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:31px;font-weight:700}.p{font-size:16px;fill:#4c554a}.s{font-size:12px;font-weight:700;letter-spacing:1.2px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="64" class="t h">Judge the offer before the layout</text><text x="70" y="96" class="p">Seven checks, ordered by how much each one usually decides.</text><rect x="200" y="148" width="880" height="54" rx="14" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="224" y="182" class="t s" fill="#0b5c40">1</text><text x="640" y="182" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1c211b" text-anchor="middle">The offer</text><rect x="231" y="209" width="818" height="54" rx="14" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="255" y="243" class="t s" fill="#0b5c40">2</text><text x="640" y="243" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1c211b" text-anchor="middle">Above-the-fold decision logic</text><rect x="262" y="270" width="756" height="54" rx="14" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="286" y="304" class="t s" fill="#0b5c40">3</text><text x="640" y="304" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1c211b" text-anchor="middle">Message match</text><rect x="293" y="331" width="694" height="54" rx="14" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="317" y="365" class="t s" fill="#8a938a">4</text><text x="640" y="365" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#1c211b" text-anchor="middle">Friction removed before checkout</text><rect x="324" y="392" width="632" height="54" rx="14" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="348" y="426" class="t s" fill="#8a938a">5</text><text x="640" y="426" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#1c211b" text-anchor="middle">Proof placement</text><rect x="355" y="453" width="570" height="54" rx="14" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="379" y="487" class="t s" fill="#8a938a">6</text><text x="640" y="487" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#1c211b" text-anchor="middle">Build and maintenance cost</text><rect x="386" y="514" width="508" height="54" rx="14" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="410" y="548" class="t s" fill="#8a938a">7</text><text x="640" y="548" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#1c211b" text-anchor="middle">Measurability</text><path d="M174 148h-14v176h14" fill="none" stroke="#0f8a5f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="230" class="t s" fill="#0b5c40" text-anchor="end">SETTLES</text><text x="148" y="250" class="t s" fill="#0b5c40" text-anchor="end">MOST OF IT</text><rect x="70" y="586" width="1060" height="58" rx="18" fill="#103a2a"/><text x="102" y="622" font-family="Arial,sans-serif" font-size="17" fill="#f0f6ee">A plain page with a clear, well-matched offer beats a beautiful page selling something vague.</text></svg>