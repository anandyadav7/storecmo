<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Small-budget ecommerce marketing sequence</title><desc id="desc">A four-stage sequence showing conversion first, followed by retention, owned traffic, and narrowly targeted paid acquisition.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:32px;font-weight:700}.p{font-size:16px;fill:#4c554a}.k{font-size:22px;font-weight:700}.s{font-size:14px;font-weight:700;fill:#0b5c40;letter-spacing:1.4px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="84" class="t h">Small budgets work best in a deliberate order</text><text x="70" y="119" class="p">Do not buy more traffic before the store can convert and retain it.</text><path d="M165 510H1020" stroke="#c8d0c2" stroke-width="6" stroke-linecap="round"/><g><circle cx="205" cy="510" r="50" fill="#103a2a"/><text x="190" y="518" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#f0f6ee">1</text><text x="112" y="415" class="t s">FIRST</text><text x="112" y="450" class="t k">Convert</text><text x="112" y="480" class="p">Make current traffic count</text></g><g><circle cx="465" cy="510" r="50" fill="#0f8a5f"/><text x="450" y="518" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">2</text><text x="372" y="415" class="t s">THEN</text><text x="372" y="450" class="t k">Retain</text><text x="372" y="480" class="p">Sell again to buyers</text></g><g><circle cx="725" cy="510" r="50" fill="#ff8a5c"/><text x="710" y="518" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#7a3c17">3</text><text x="632" y="415" class="t s">THEN</text><text x="632" y="450" class="t k">Build owned traffic</text><text x="632" y="480" class="p">SEO, reviews, partners</text></g><g><circle cx="985" cy="510" r="50" fill="#fff" stroke="#0f8a5f" stroke-width="5"/><text x="970" y="518" class="t k">4</text><text x="876" y="415" class="t s">LAST</text><text x="876" y="450" class="t k">Paid acquisition</text><text x="876" y="480" class="p">Test it narrowly</text></g></svg>
