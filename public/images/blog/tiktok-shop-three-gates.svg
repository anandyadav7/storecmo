<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Three gates for deciding whether to add TikTok Shop</title><desc id="desc">Read left to right. Gate one is margin after fees, gate two is a weekly video count you can sustain for twelve weeks, gate three is naming what the channel displaces. A failure at any gate means not this quarter. Passing all three earns a one-quarter pilot, not a permanent commitment.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:31px;font-weight:700}.p{font-size:16px;fill:#4c554a}.k{font-size:22px;font-weight:700}.b{font-size:15px;fill:#4c554a}.s{font-size:12px;font-weight:700;letter-spacing:1.2px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="64" class="t h">Stop at the first gate that fails</text><text x="70" y="96" class="p">All three use your numbers. Any one of them failing is a no for this quarter.</text><rect x="70" y="175" width="320" height="170" rx="20" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="96" y="211" class="t s" fill="#0b5c40">GATE 01</text><text x="96" y="249" class="t k">Margin after fees</text><text x="96" y="287" class="t b">Price minus COGS, pick and pack,</text><text x="96" y="309" class="t b">shipping you absorb, processing,</text><text x="96" y="331" class="t b">and TikTok's commission.</text><path d="M390 260h30" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><text x="405" y="248" class="t s" fill="#0b5c40" text-anchor="middle">PASS</text><path d="M230 345v38" stroke="#ff8a5c" stroke-width="4" stroke-linecap="round"/><text x="244" y="371" class="t s" fill="#7a3c17">FAIL</text><rect x="420" y="175" width="320" height="170" rx="20" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="446" y="211" class="t s" fill="#0b5c40">GATE 02</text><text x="446" y="249" class="t k">Weekly video count</text><text x="446" y="287" class="t b">The number you can publish for</text><text x="446" y="309" class="t b">twelve straight weeks without</text><text x="446" y="331" class="t b">pausing email or ads.</text><path d="M740 260h30" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><text x="755" y="248" class="t s" fill="#0b5c40" text-anchor="middle">PASS</text><path d="M580 345v38" stroke="#ff8a5c" stroke-width="4" stroke-linecap="round"/><text x="594" y="371" class="t s" fill="#7a3c17">FAIL</text><rect x="770" y="175" width="320" height="170" rx="20" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="796" y="211" class="t s" fill="#0b5c40">GATE 03</text><text x="796" y="249" class="t k">What it displaces</text><text x="796" y="287" class="t b">Name the hours this takes,</text><text x="796" y="309" class="t b">and the work that stops</text><text x="796" y="331" class="t b">when they move.</text><path d="M930 345v38" stroke="#ff8a5c" stroke-width="4" stroke-linecap="round"/><text x="944" y="371" class="t s" fill="#7a3c17">FAIL</text><rect x="70" y="383" width="1020" height="56" rx="16" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="580" y="419" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#7a3c17" text-anchor="middle">Not this quarter. Put the hours where they already pay.</text><path d="M1090 260h30" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/><rect x="70" y="548" width="1060" height="78" rx="22" fill="#103a2a"/><text x="102" y="582" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#8fae9c" letter-spacing="1.2">ALL THREE PASS</text><text x="102" y="610" font-family="Arial,sans-serif" font-size="17" fill="#f0f6ee">Pilot it for one quarter at a video count you can actually sustain, then judge it on margin per order.</text></svg>