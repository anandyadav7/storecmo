<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">One cohort grid, three different repeat purchase rates</title><desc id="desc">A cohort grid with first-purchase months as rows and months since first order as columns. The complete August cohort reads 18 percent at 30 days, 28 percent at 90 days and 42 percent at twelve months. The same customers produce all three numbers.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:32px;font-weight:700}.p{font-size:16px;fill:#4c554a}.c{font-size:16px;font-weight:700;fill:#1c211b}.r{font-size:15px;fill:#4c554a}.s{font-size:12px;font-weight:700;letter-spacing:1.1px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="68" class="t h">One cohort. Three different answers.</text><text x="70" y="100" class="p">The same customers read 18%, 28% or 42% depending only on where you stop.</text><rect x="379" y="128" width="129" height="330" rx="16" fill="#e2efe6"/><rect x="629" y="128" width="129" height="330" rx="16" fill="#e2efe6"/><rect x="1004" y="128" width="129" height="330" rx="16" fill="#e2efe6"/><text x="318" y="166" class="t s" fill="#0b5c40" text-anchor="middle">M0</text><text x="443" y="166" class="t s" fill="#0b5c40" text-anchor="middle">M1</text><text x="568" y="166" class="t s" fill="#0b5c40" text-anchor="middle">M2</text><text x="693" y="166" class="t s" fill="#0b5c40" text-anchor="middle">M3</text><text x="818" y="166" class="t s" fill="#0b5c40" text-anchor="middle">M6</text><text x="943" y="166" class="t s" fill="#0b5c40" text-anchor="middle">M9</text><text x="1068" y="166" class="t s" fill="#0b5c40" text-anchor="middle">M12</text><text x="70" y="209" class="t r">Aug 2026</text><rect x="260" y="180" width="117" height="44" rx="12" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="318" y="209" class="t c" text-anchor="middle">4%</text><rect x="385" y="180" width="117" height="44" rx="12" fill="#ff