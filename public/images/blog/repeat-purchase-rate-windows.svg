le">38%</text><text x="70" y="313" class="t r">Oct 2026</text><rect x="260" y="284" width="117" height="44" rx="12" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="318" y="313" class="t c" text-anchor="middle">5%</text><rect x="385" y="284" width="117" height="44" rx="12" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="443" y="313" class="t c" text-anchor="middle">19%</text><rect x="510" y="284" width="117" height="44" rx="12" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="568" y="313" class="t c" text-anchor="middle">25%</text><rect x="635" y="284" width="117" height="44" rx="12" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="693" y="313" class="t c" text-anchor="middle">29%</text><rect x="760" y="284" width="117" height="44" rx="12" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="818" y="313" class="t c" text-anchor="middle">36%</text><text x="70" y="365" class="t r">Nov 2026</text><rect x="260" y="336" width="117" height="44" rx="12" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="318" y="365" class="t c" text-anchor="middle">3%</text><rect x="385" y="336" width="117" height="44" rx="12" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="443" y="365" class="t c" text-anchor="middle">14%</text><rect x="510" y="336" width="117" height="44" rx="12" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="568" y="365" class="t c" text-anchor="middle">19%</text><rect x="635" y="336" width="117" height="44" rx="12" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="693" y="365" class="t c" text-anchor="middle">23%</text><text x="70" y="417" class="t r">Dec 2026</text><rect x="260" y="388" width="117" height="44" rx="12" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="318" y="417" class="t c" text-anchor="middle">4%</text><rect x="385" y="388" width="117" height="44" rx="12" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="443" y="417" class="t c" text-anchor="midd