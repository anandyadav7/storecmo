<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Three tiers of product feed work, in running order</title><desc id="desc">Tier one is eligibility: items missing from Merchant Center, disapprovals and required attributes. Tier two is discoverability: titles, product type and Google product category. Tier three is reporting: custom labels and optional descriptive fields. A missing GTIN looks like tier three work but surfaces as a disapproval, so it belongs in tier one.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:32px;font-weight:700}.p{font-size:16px;fill:#4c554a}.k{font-size:23px;font-weight:700}.q{font-size:15px;fill:#4c554a}.f{font-size:16px;fill:#1c211b}.s{font-size:12px;font-weight:700;letter-spacing:1.2px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="68" class="t h">Clear the blockers before you polish fields</text><text x="70" y="100" class="p">Work down. Nothing in tier two matters while a bestseller sits disapproved.</text><rect x="70" y="150" width="1060" height="118" rx="22" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="102" y="186" class="t s" fill="#0b5c40">TIER 01</text><text x="102" y="220" class="t k">Eligibility</text><text x="102" y="248" class="t q">Is it allowed to show at all?</text><text x="510" y="194" class="t f">Missing from Merchant Center  .  Disapprovals</text><text x="510" y="220" class="t f">Required attributes  .  Blank description</text><text x="510" y="250" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0b5c40">A disapproved product earns nothing today.</text><rect x="70" y="282" width="1060" height="118" rx="22" fill="#ffffff" stroke="#dde3d9" stroke-width="2"/><text x="102" y="318" class="t s" fill="#0b5c40">TIER 02</text><text x="102" y="352" class="t k">Discoverability</text><text x="102" y="380" class="t q">Which searches do you match?</text><text x="510" y="326" class="t f">Titles  .  Your own product type hierarchy</text><text x="510" y="352" class="t f">Google product category</text><text x="510" y="382" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#4c554a">An afternoon. Top twenty titles by hand.</text><rect x="70" y="414" width="1060" height="118" rx="22" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><text x="102" y="450" class="t s" fill="#7a3c17">TIER 03</text><text x="102" y="484" class="t k">Reporting</text><text x="102" y="512" class="t q">Can you read what happened?</text><text x="510" y="458" class="t f">Custom labels  .  Colour, size, material</text><text x="510" y="484" class="t f">The optional descriptive fields</text><text x="510" y="514" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#7a3c17">A quiet hour, in bulk, later.</text><rect x="70" y="552" width="1060" height="76" rx="22" fill="#103a2a"/><text x="102" y="584" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#8fae9c" letter-spacing="1.2">THE ONE THAT MOVES TIER</text><text x="102" y="612" font-family="Arial,sans-serif" font-size="17" fill="#f0f6ee">A missing GTIN or MPN looks like tidying. It surfaces as a disapproval, so it is tier one.</text></svg>