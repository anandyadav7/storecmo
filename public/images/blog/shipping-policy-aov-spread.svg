<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Shipping policy judged across the spread of basket sizes</title><desc id="desc">Free shipping on everything loses money on every basket below the point where product margin covers a label. A flat rate stays profitable across the whole range but overcharges one-item orders. A threshold charges small baskets and rewards large ones. The average order value sits in the middle and settles nothing.</desc><style>.t{font-family:Arial,sans-serif;fill:#1c211b}.h{font-size:31px;font-weight:700}.p{font-size:16px;fill:#4c554a}.r{font-size:18px;font-weight:700}.n{font-size:14px;fill:#4c554a}.s{font-size:12px;font-weight:700;letter-spacing:1.2px}</style><rect width="1200" height="675" rx="32" fill="#f3f5f0"/><text x="70" y="64" class="t h">The average settles nothing</text><text x="70" y="96" class="p">Price one small basket and one large one. The winner is rarely the same at both ends.</text><text x="400" y="150" class="t s" fill="#0b5c40">SMALL BASKET</text><text x="1130" y="150" class="t s" fill="#0b5c40" text-anchor="end">LARGE BASKET</text><path d="M700 160V470" stroke="#8a938a" stroke-width="2" stroke-dasharray="7 6"/><text x="70" y="210" class="t r">Free shipping on everything</text><text x="70" y="234" class="t n">Loses the label on every basket below the line</text><rect x="400" y="180" width="390" height="58" rx="14" fill="#fff3ec" stroke="#ffd9c4" stroke-width="2"/><rect x="790" y="180" width="340" height="58" rx="14" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="595" y="216" class="t" font-size="16" font-weight="700" fill="#7a3c17" text-anchor="middle">loses money here</text><text x="960" y="216" class="t" font-size="16" fill="#0b5c40" text-anchor="middle">margin covers it</text><text x="70" y="315" class="t r">Flat rate</text><text x="70" y="339" class="t n">Profitable throughout. Overcharges one-item orders</text><rect x="400" y="285" width="120" height="58" rx="14" fill="#f3f5f0" stroke="#dde3d9" stroke-width="2"/><rect x="520" y="285" width="610" height="58" rx="14" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><text x="460" y="321" class="t" font-size="15" fill="#4c554a" text-anchor="middle">feels steep</text><text x="825" y="321" class="t" font-size="16" fill="#0b5c40" text-anchor="middle">predictable margin</text><text x="70" y="420" class="t r">Free above a threshold</text><text x="70" y="444" class="t n">Charges small baskets, rewards large ones</text><rect x="400" y="390" width="390" height="58" rx="14" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><rect x="790" y="390" width="340" height="58" rx="14" fill="#e2efe6" stroke="#bcd3c4" stroke-width="2"/><path d="M790 384v70" stroke="#0f8a5f" stroke-width="4"/><text x="595" y="426" class="t" font-size="16" fill="#0b5c40" text-anchor="middle">customer pays</text><text x="960" y="426" class="t" font-size="16" fill="#0b5c40" text-anchor="middle">you pay, margin allows it</text><text x="790" y="476" class="t s" fill="#0b5c40" text-anchor="middle">THRESHOLD</text><text x="700" y="178" class="t s" fill="#4c554a" text-anchor="middle">YOUR AOV</text><rect x="70" y="520" width="1060" height="96" rx="24" fill="#103a2a"/><text x="102" y="556" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#8fae9c" letter-spacing="1.2">WHY THE AVERAGE MISLEADS</text><text x="102" y="584" font-family="Arial,sans-serif" font-size="17" fill="#f0f6ee">Half your orders sit left of that line. A policy that works at the average can still lose money on most baskets.</text><text x="102" y="606" font-family="Arial,sans-serif" font-size="15" fill="#bcd3c4">Price the ends, not the middle.</text></svg>